<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hai Pantai explainer</title>
<style>
@font-face { font-family: "Nunito"; src: url("fonts/nunito-latin-wght-normal.woff2") format("woff2"); font-weight: 200 1000; }
:root {
  --ink: #12343b; --brand: #0e9f9a; --brand-ink: #0b6b68; --brand-soft: #e6f5f4; --sand: #fbf6ec; --sand2: #f3ecdd;
  --line: #eadfc8; --coral: #ff6b4a; --coral-soft: #ffe7e1; --coral-ink: #b83a1e; --good: #22c55e; --good-soft: #dcfce7;
  --good-ink: #15803d; --amber: #f59e0b; --amber-soft: #fef3c7; --amber-ink: #92400e; --sea: #cfe9ea; --sun: #ffd27a; --muted: #5d7377;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1920px; height: 1080px; overflow: hidden; background: var(--sand); }
body { font-family: "Nunito", ui-rounded, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
.emoji { font-family: "Noto Color Emoji", sans-serif; font-weight: 400; }
#stage { position: absolute; inset: 0; overflow: hidden; }
.scene { position: absolute; inset: 0; overflow: hidden; display: none; }
.abs { position: absolute; will-change: transform, opacity; }
.c { transform-origin: center; }
.h1 { font-weight: 900; font-size: 92px; line-height: 1.02; letter-spacing: -2px; }
.h2 { font-weight: 900; font-size: 66px; line-height: 1.05; letter-spacing: -1.4px; }
.lead { font-weight: 700; font-size: 34px; line-height: 1.35; color: var(--muted); }
.kicker { font-weight: 900; font-size: 26px; letter-spacing: 4px; text-transform: uppercase; color: var(--brand); }
.pill { display: inline-flex; align-items: center; gap: 12px; border-radius: 999px; font-weight: 800; }
.card { background: #fff; border-radius: 32px; box-shadow: 0 30px 80px -20px rgba(18,52,59,.28), 0 4px 14px rgba(18,52,59,.06); }
.mark { background: linear-gradient(transparent 62%, rgba(14,159,154,.28) 62%); background-size: var(--w, 0%) 100%; background-repeat: no-repeat; }
.mark.coral { background-image: linear-gradient(transparent 62%, rgba(255,107,74,.32) 62%); }
.word { display: inline-block; }
.bullet { display: flex; align-items: center; gap: 22px; font-size: 32px; font-weight: 800; line-height: 1.25; }
.bullet .ic { flex: none; width: 70px; height: 70px; border-radius: 22px; display: grid; place-items: center; font-size: 38px; }

/* phone */
.phone { width: 440px; height: 900px; border-radius: 70px; background: #0d2328; padding: 14px; box-shadow: 0 60px 120px -30px rgba(18,52,59,.55), inset 0 0 0 2px #2b4a50; }
.screen { position: relative; width: 100%; height: 100%; border-radius: 57px; overflow: hidden; background: var(--sea); }
.notch { position: absolute; top: 12px; left: 50%; width: 120px; height: 34px; margin-left: -60px; background: #0d2328; border-radius: 20px; z-index: 50; }
.status { position: absolute; top: 18px; left: 40px; right: 40px; display: flex; justify-content: space-between; font-weight: 800; font-size: 17px; z-index: 40; }
.tabbar { position: absolute; left: 0; right: 0; bottom: 0; height: 88px; background: rgba(255,255,255,.96); border-top: 1px solid var(--line); display: flex; z-index: 30; padding-bottom: 14px; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 13px; font-weight: 800; color: var(--muted); }
.tab i { display: grid; place-items: center; width: 54px; height: 30px; border-radius: 99px; font-style: normal; font-size: 18px; }
.tab.on { color: var(--brand); } .tab.on i { background: var(--brand-soft); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: #fff; border-radius: 34px 34px 0 0; box-shadow: 0 -8px 40px rgba(18,52,59,.22); z-index: 35; padding: 16px 22px 24px; }
.grab { width: 54px; height: 6px; border-radius: 9px; background: var(--line); margin: 0 auto 14px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 14px; font-weight: 800; font-size: 16px; background: var(--sand2); color: var(--ink); }
.chip.on { background: var(--brand); color: #fff; }
.btn { display: flex; align-items: center; justify-content: center; gap: 10px; height: 62px; border-radius: 20px; font-weight: 900; font-size: 21px; color: #fff; background: var(--brand); }
.tap { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; z-index: 80; pointer-events: none; }
.tap .dot { position: absolute; inset: 22px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 6px 18px rgba(0,0,0,.25); }
.tap .ring { position: absolute; inset: 0; border-radius: 50%; border: 5px solid rgba(255,255,255,.9); }

/* league rows */
.row { position: absolute; left: 0; width: 980px; height: 104px; display: flex; align-items: center; gap: 26px; padding: 0 34px; background: #fff; border-radius: 28px; box-shadow: 0 14px 36px -16px rgba(18,52,59,.3); }
.rank { width: 56px; height: 56px; border-radius: 18px; display: grid; place-items: center; font-weight: 900; font-size: 28px; background: var(--sand2); }
.bar { height: 16px; border-radius: 9px; background: var(--sand2); overflow: hidden; }
.bar > div { height: 100%; border-radius: 9px; }

.badge { position: absolute; width: 230px; text-align: center; }
.medal { width: 150px; height: 150px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; font-size: 74px; background: radial-gradient(circle at 35% 30%, #fff 0, #fff7e3 40%, #ffe3a6 100%); box-shadow: inset 0 -8px 0 rgba(146,64,14,.12), 0 18px 40px -14px rgba(146,64,14,.5); border: 6px solid #fff; }
.badge b { display: block; margin-top: 16px; font-size: 26px; font-weight: 900; }
.badge span { display: block; font-size: 19px; font-weight: 700; color: var(--muted); }
</style>
</head>
<body>
<div id="stage"></div>
<script src="geo.js"></script>
<script src="anim.js"></script>
</body>
</html>
