<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hai Pantai launch film</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage"><div class="grain" id="grain"></div></div>
<script src="timeline.js"></script>
<script src="geo.js"></script>
<script src="lib.js"></script>
<script src="art.js"></script>
<script src="scenes-a.js"></script>
<script src="scenes-b.js"></script>
<script src="scenes-c.js"></script>
<script>
  const stage = $("#stage"), grain = $("#grain");
  for (const sc of SCENES) {
    sc.root = document.createElement("div");
    sc.root.className = "scene"; sc.root.dataset.name = sc.name;
    stage.insertBefore(sc.root, grain);
    sc.build(sc.root);
  }
  window.DURATION = TL.DURATION;
  window.renderFrame = (t) => {
    for (const sc of SCENES) {
      const on = t >= sc.t0 && t < sc.t1;
      const v = on ? "visible" : "hidden";
      if (sc.root.style.visibility !== v) sc.root.style.visibility = v;
      if (on) sc.update(t - sc.t0, sc.root);
    }
    grain.style.transform = `translate(${(Math.sin(t * 91) * 40).toFixed(0)}px,${(Math.cos(t * 77) * 40).toFixed(0)}px)`;
  };
  window.ready = document.fonts.ready.then(() => true);
  const qs = new URLSearchParams(location.search);
  if (qs.has("t")) window.ready.then(() => renderFrame(+qs.get("t")));
  if (qs.has("play")) {
    const t0 = performance.now() - (+qs.get("play") || 0) * 1000;
    const loop = () => { renderFrame(((performance.now() - t0) / 1000) % TL.DURATION); requestAnimationFrame(loop); };
    window.ready.then(loop);
  }
</script>
</body>
</html>
