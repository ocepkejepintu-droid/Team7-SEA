<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#0e9f9a" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Hai Pantai</title>
    <script>
      /* Set the theme before first paint so a dark-mode user never sees a light flash. Mirrors src/lib/theme.ts. */
      (function () {
        var t = null;
        try { t = localStorage.getItem("pantai.theme"); } catch (e) {}
        if (t !== "light" && t !== "dark") t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <meta name="description" content="Report and clean trash on Bali's coast. Beaches compete; the cleanest wins." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
